<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>⚡ FlashBot</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#1e293b;
color:white;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
max-width:80%;
padding:12px;
border-radius:15px;
margin:8px 0;
word-wrap:break-word;
}

.user{
background:#2563eb;
color:white;
margin-left:auto;
}

.bot{
background:#1e293b;
color:white;
}

.bottom{
display:flex;
gap:10px;
padding:15px;
background:#111827;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
outline:none;
}

button{
padding:12px 18px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
cursor:pointer;
}
</style>
</head>
<body>

<header>⚡ FlashBot</header>

<div id="chat">
<div class="msg bot">
Halo! Aku FlashBot 🚀
</div>
</div>

<div class="bottom">
<input id="input" placeholder="Tulis pesan...">
<button onclick="send()">Kirim</button>
</div>

<script>

const chat=document.getElementById("chat");
const input=document.getElementById("input");

async function send(){

const text=input.value.trim();

if(!text) return;

chat.innerHTML += `
<div class="msg user">${text}</div>
`;

input.value="";

chat.innerHTML += `
<div class="msg bot" id="loading">
⌨️ FlashBot sedang mengetik...
</div>
`;

chat.scrollTop=chat.scrollHeight;

try{

const response = await fetch("/api/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text
})
});

const data = await response.json();

document.getElementById("loading").remove();

const reply =
data.reply || "Tidak ada jawaban.";

chat.innerHTML += `
<div class="msg bot">${reply}</div>
`;

}
catch(err){

document.getElementById("loading").remove();

chat.innerHTML += `
<div class="msg bot">
❌ Server belum terhubung.
</div>
`;

}

chat.scrollTop=chat.scrollHeight;

}

input.addEventListener("keypress",e=>{
if(e.key==="Enter"){
send();
}
});

</script>

</body>
</html>
