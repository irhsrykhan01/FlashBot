<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Rashii</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0f172a;
height:100vh;
display:flex;
flex-direction:column;
}

header{
padding:15px;
text-align:center;
background:#1e293b;
color:white;
font-size:22px;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.3);
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
max-width:80%;
padding:10px 14px;
margin:8px 0;
border-radius:15px;
word-wrap:break-word;
}

.user{
background:#2563eb;
color:white;
margin-left:auto;
}

.bot{
background:#1e293b;
color:white;
}

.bottom{
display:flex;
gap:10px;
padding:15px;
background:#111827;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:12px;
outline:none;
background:#1e293b;
color:white;
}

button{
padding:12px 20px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<header>
⚡FlashBot AI
</header>

<div id="chat">

<div class="msg bot">
Halo! Aku AI Buatan Danz_kuyyy 👋
</div>

</div>

<div class="bottom">
<input id="input" placeholder="Tulis pesan...">
<button onclick="send()">Kirim</button>
</div>

<script>
function send(){

let text=input.value;

if(!text) return;

chat.innerHTML +=
`<div class="msg user">${text}</div>`;

input.value="";

chat.scrollTop=chat.scrollHeight;
}
</script>

</body>
</html>
